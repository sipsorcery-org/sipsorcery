<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Relay path</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
    .tile { position: absolute; background: #000; border-radius: 6px; overflow: hidden; }
    .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile.self video { transform: scaleX(-1); }
    .label { position: absolute; left: 8px; bottom: 6px; font: 12px system-ui; color: #fff; text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
  <script type="module" src="relay.js"></script>
</body>
</html>
