<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Client Codecs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f8f9fa;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.25rem;
            margin: 0.25rem 0 0.5rem;
        }
        .intro {
            text-align: center;
            color: #555;
            margin: 0 0 1rem;
        }
        video {
            width: 640px;
            height: 480px;
            background: #000;
            border-radius: 8px;
            max-width: 100%;
            max-height: 100vh;
        }
        #stats {
            font-family: monospace;
            min-height: 1.2em;
            margin: 0.5rem 0 1rem;
            color: #333;
            text-align: center;
        }
        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: stretch;
        }
        .choice {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }
        .choice label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        select {
            padding: 0.5rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
        }
        #libraryInfo {
            text-align: center;
            color: #555;
            font-size: 0.9rem;
            min-height: 1.2em;
            margin: 0;
        }
        #error {
            text-align: center;
            color: #b52a37;
            min-height: 1.2em;
            margin: 0;
        }
        input[type="text"] {
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 0;
        }
        .button-group {
            display: flex;
            flex-direction: row;
            gap: 1rem;
            justify-content: center;
            margin-top: 0.5rem;
        }
        button {
            padding: 1rem 2rem;
            font-size: 1.25rem;
            min-width: 120px;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-start {
            background: #28a745;
        }
        button.btn-start:active {
            background: #218838;
        }
        button.btn-close {
            background: #dc3545;
        }
        button.btn-close:active {
            background: #b52a37;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        a {
            color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebRTC Client Codecs</h1>
        <p class="intro">This page sends its camera, or a test pattern, to the program, which decodes it and shows it in its window.</p>
        <video autoplay muted id="videoCtl" playsinline width="640" height="480"></video>
        <div id="stats"></div>
        <form class="controls" onsubmit="return false;">
            <div class="choice">
                <label>Codec <select id="codec" onchange="fillLibraries();"></select></label>
                <label>Decoder <select id="library" onchange="showLibraryInfo();"></select></label>
                <label><input type="checkbox" id="pattern" /> Test pattern instead of the camera</label>
            </div>
            <p id="libraryInfo"></p>
            <input type="text" id="websockurl" autocomplete="off" inputmode="url" placeholder="WebSocket URL" />
            <div class="button-group">
                <button type="button" id="startBtn" class="btn-start" onclick="start();" disabled>Start</button>
                <button type="button" id="closeBtn" class="btn-close" onclick="closePeer();" disabled>Close</button>
            </div>
            <p id="error"></p>
        </form>
        <p><a href="codecs.html">Which video codecs can this browser send?</a></p>
    </div>
    <script>
        const STUN_URL = "stun:stun.cloudflare.com";

        const codecSelect = document.getElementById("codec");
        const librarySelect = document.getElementById("library");
        const patternCheck = document.getElementById("pattern");

        let pc, ws, stream, statsTimer, patternTimer;

        // The libraries the server has, each with the codecs it decodes and, if it can't be used
        // on the server's machine, why not.
        let libraries = [];

        // The video codecs this browser can send, or null if it can't say.
        const sendable = (() => {
            const capabilities = RTCRtpSender.getCapabilities?.("video");
            return capabilities ? new Set(capabilities.codecs.map(c => c.mimeType.replace(/^video\//i, "").toUpperCase())) : null;
        })();

        // The server's web socket, on the same host as this page.
        function getWebSocketUrl() {
            const protocol = location.protocol === "https:" ? "wss:" : "ws:";
            return `${protocol}//${location.host}/ws`;
        }

        function setButtonStates(startEnabled, closeEnabled) {
            document.getElementById("startBtn").disabled = !startEnabled;
            document.getElementById("closeBtn").disabled = !closeEnabled;
            // The codec is fixed for a connection; Close and Start again to change it.
            codecSelect.disabled = librarySelect.disabled = patternCheck.disabled = !startEnabled;
        }

        function selectFirstEnabled(select) {
            const option = [...select.options].find(o => !o.disabled);
            if (option) {
                select.value = option.value;
            }
        }

        // Fills the codec list from the server's libraries, leaving out none but disabling those
        // that this browser can't send or that no available library decodes.
        async function loadLibraries() {
            try {
                const response = await (await fetch("libraries")).json();
                libraries = response.libraries;

                for (const codec of response.codecs) {
                    const option = new Option(codec, codec);
                    if (sendable && !sendable.has(codec.toUpperCase())) {
                        option.text += " (this browser can't send it)";
                        option.disabled = true;
                    }
                    else if (!libraries.some(l => l.codecs.includes(codec) && !l.unavailable)) {
                        option.text += " (no decoder available)";
                        option.disabled = true;
                    }
                    codecSelect.add(option);
                }

                selectFirstEnabled(codecSelect);
                fillLibraries();
                setButtonStates(true, false);
            }
            catch (err) {
                document.getElementById("error").textContent = `Could not read the server's libraries: ${err}`;
            }
        }

        // Fills the decoder list with the libraries that decode the chosen codec.
        function fillLibraries() {
            librarySelect.length = 0;
            for (const library of libraries.filter(l => l.codecs.includes(codecSelect.value))) {
                const option = new Option(library.unavailable ? `${library.name} (not available)` : library.name, library.name);
                option.disabled = !!library.unavailable;
                librarySelect.add(option);
            }
            selectFirstEnabled(librarySelect);
            showLibraryInfo();
        }

        // Says what the chosen library is, and why any other one for this codec can't be used.
        function showLibraryInfo() {
            const forCodec = libraries.filter(l => l.codecs.includes(codecSelect.value));
            const chosen = forCodec.find(l => l.name === librarySelect.value);
            const notes = forCodec.filter(l => l.unavailable).map(l => `${l.name}: ${l.unavailable}`);
            document.getElementById("libraryInfo").textContent = [chosen?.description, ...notes].filter(Boolean).join(" ");
        }

        // A moving test pattern, for a machine with no camera or when one isn't wanted.
        function testPatternStream() {
            const canvas = document.createElement("canvas");
            canvas.width = 640;
            canvas.height = 480;
            const ctx = canvas.getContext("2d");
            const bars = ["#c0c0c0", "#c0c000", "#00c0c0", "#00c000", "#c000c0", "#c00000", "#0000c0"];
            let frame = 0;
            patternTimer = setInterval(() => {
                bars.forEach((c, i) => {
                    ctx.fillStyle = c;
                    ctx.fillRect(i * canvas.width / bars.length, 0, canvas.width / bars.length + 1, canvas.height);
                });
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 360, canvas.width, 120);
                ctx.fillStyle = "#fff";
                ctx.font = "48px monospace";
                ctx.fillText(`frame ${frame}`, 20, 435);
                ctx.fillRect((frame * 4) % canvas.width, 20, 40, 40);
                frame++;
            }, 1000 / 30);
            return canvas.captureStream(30);
        }

        // The camera, or the test pattern if it's asked for or there's no camera.
        async function getStream() {
            if (!patternCheck.checked) {
                try {
                    return await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                }
                catch (err) {
                    console.log(`No camera (${err.name}), sending a test pattern instead.`);
                }
            }
            return testPatternStream();
        }

        // Shows what the browser is sending.
        async function showStats() {
            if (!pc) {
                return;
            }

            const stats = await pc.getStats();
            let text = "";
            stats.forEach(report => {
                if (report.type === "outbound-rtp" && report.kind === "video") {
                    const codec = stats.get(report.codecId)?.mimeType ?? "";
                    const size = report.frameWidth ? `${report.frameWidth}x${report.frameHeight}` : "";
                    const encoder = report.encoderImplementation ? `, encoder ${report.encoderImplementation}` : "";
                    text = `${codec} ${size} ${Math.round(report.framesPerSecond ?? 0)} fps, ${report.framesEncoded ?? 0} frames sent, ` +
                        `${report.keyFramesEncoded ?? 0} key frames, ${report.pliCount ?? 0} PLIs${encoder}`;
                }
            });
            document.getElementById("stats").textContent = text;
        }

        async function start() {
            setButtonStates(false, false);
            document.getElementById("error").textContent = "";
            document.getElementById("stats").textContent = "";

            stream = await getStream();
            document.querySelector("#videoCtl").srcObject = stream;

            pc = new RTCPeerConnection({ iceServers: [{ urls: STUN_URL }] });

            // The server's offer has one receive only video track, which the browser's track is sent on.
            stream.getTracks().forEach(track => pc.addTrack(track, stream));

            pc.onicecandidate = evt => evt.candidate && ws.send(JSON.stringify(evt.candidate));

            pc.onconnectionstatechange = () => {
                console.log(`Peer connection state changed to ${pc?.connectionState}.`);
                if (pc?.connectionState === "failed") {
                    closePeer();
                }
            };

            // The server reads the codec and library from the query string.
            const url = new URL(document.querySelector("#websockurl").value);
            url.searchParams.set("codec", codecSelect.value);
            url.searchParams.set("library", librarySelect.value);

            let opened = false;
            ws = new WebSocket(url, []);

            ws.onopen = () => {
                opened = true;
                setButtonStates(false, true);
            };

            // The server sends the offer and its ICE candidates; the page answers.
            ws.onmessage = async evt => {
                const obj = JSON.parse(evt.data);
                if (obj?.candidate) {
                    await pc.addIceCandidate(obj);
                }
                else if (obj?.sdp) {
                    await pc.setRemoteDescription(new RTCSessionDescription(obj));
                    await pc.setLocalDescription(await pc.createAnswer());
                    ws.send(JSON.stringify(pc.localDescription));
                    watchForServerClose(pc);
                }
            };

            // The server closes the web socket once the peer connection is up, which leaves the
            // media flowing. A close before it opened means it refused the connection.
            ws.onclose = evt => {
                console.log(`Web socket closed, code ${evt.code}.`);
                if (!opened) {
                    document.getElementById("error").textContent = "The server refused the connection; its log says why.";
                    closePeer();
                }
            };

            statsTimer = setInterval(showStats, 1000);
        }

        // The server closes the connection when another browser connects, or when it exits. The
        // DTLS transport says so at once; the connection state only once ICE gives up on the
        // server, half a minute later.
        function watchForServerClose(connection) {
            const transport = connection.getSenders()[0]?.transport;
            if (transport) {
                transport.onstatechange = () => {
                    if (pc === connection && (transport.state === "closed" || transport.state === "failed")) {
                        closePeer();
                        document.getElementById("error").textContent = "The server closed the connection: another browser connected, or it stopped.";
                    }
                };
            }
        }

        function closePeer() {
            clearInterval(statsTimer);
            clearInterval(patternTimer);
            stream?.getTracks().forEach(track => track.stop());
            pc?.close();
            ws?.close();
            pc = ws = stream = undefined;
            document.querySelector("#videoCtl").srcObject = null;
            setButtonStates(true, false);
        }

        document.querySelector("#websockurl").value = getWebSocketUrl();
        loadLibraries();
    </script>
</body>
</html>
