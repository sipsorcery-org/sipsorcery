<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Get Started Codecs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f8f9fa;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.25rem;
            margin: 0.25rem 0 1rem;
        }
        video {
            width: 640px;
            height: 480px;
            background: #000;
            border-radius: 8px;
            max-width: 100%;
            max-height: 100vh;
        }
        #stats {
            font-family: monospace;
            min-height: 1.2em;
            margin: 0.5rem 0 1rem;
            color: #333;
        }
        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: stretch;
        }
        .choice {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }
        .choice label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        select {
            padding: 0.5rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
        }
        #libraryInfo {
            text-align: center;
            color: #555;
            font-size: 0.9rem;
            min-height: 1.2em;
            margin: 0;
        }
        #error {
            text-align: center;
            color: #b52a37;
            min-height: 1.2em;
            margin: 0;
        }
        input[type="text"] {
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 0;
        }
        .button-group {
            display: flex;
            flex-direction: row;
            gap: 1rem;
            justify-content: center;
            margin-top: 0.5rem;
        }
        button {
            padding: 1rem 2rem;
            font-size: 1.25rem;
            min-width: 120px;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-start {
            background: #28a745;
        }
        button.btn-start:active {
            background: #218838;
        }
        button.btn-close {
            background: #dc3545;
        }
        button.btn-close:active {
            background: #b52a37;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        a {
            color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebRTC Get Started Codecs</h1>
        <video controls autoplay id="videoCtl" playsinline width="640" height="480"></video>
        <div id="stats"></div>
        <form class="controls" onsubmit="return false;">
            <div class="choice">
                <label>Codec <select id="codec" onchange="fillLibraries();"></select></label>
                <label>Encoder <select id="library" onchange="showLibraryInfo();"></select></label>
            </div>
            <p id="libraryInfo"></p>
            <input type="text" id="websockurl" autocomplete="off" inputmode="url" placeholder="WebSocket URL" />
            <div class="button-group">
                <button type="button" id="startBtn" class="btn-start" onclick="start();" disabled>Start</button>
                <button type="button" id="closeBtn" class="btn-close" onclick="closePeer();" disabled>Close</button>
            </div>
            <p id="error"></p>
        </form>
        <p><a href="codecs.html">Which video codecs can this browser receive?</a></p>
    </div>
    <script>
        const STUN_URL = "stun:stun.cloudflare.com";

        const codecSelect = document.getElementById("codec");
        const librarySelect = document.getElementById("library");

        let pc, ws, statsTimer;

        // The libraries the server has, each with the codecs it encodes and, if it can't be used
        // on the server's machine, why not.
        let libraries = [];

        // The video codecs this browser can receive, or null if it can't say.
        const receivable = (() => {
            const capabilities = RTCRtpReceiver.getCapabilities?.("video");
            return capabilities ? new Set(capabilities.codecs.map(c => c.mimeType.replace(/^video\//i, "").toUpperCase())) : null;
        })();

        // The server's web socket, on the same host as this page.
        function getWebSocketUrl() {
            const protocol = location.protocol === "https:" ? "wss:" : "ws:";
            return `${protocol}//${location.host}/ws`;
        }

        function setButtonStates(startEnabled, closeEnabled) {
            document.getElementById("startBtn").disabled = !startEnabled;
            document.getElementById("closeBtn").disabled = !closeEnabled;
            // The codec is fixed for a connection; Close and Start again to change it.
            codecSelect.disabled = librarySelect.disabled = !startEnabled;
        }

        function selectFirstEnabled(select) {
            const option = [...select.options].find(o => !o.disabled);
            if (option) {
                select.value = option.value;
            }
        }

        // Fills the codec list from the server's libraries, leaving out none but disabling those
        // that this browser can't receive or that no available library encodes.
        async function loadLibraries() {
            try {
                const response = await (await fetch("libraries")).json();
                libraries = response.libraries;

                for (const codec of response.codecs) {
                    const option = new Option(codec, codec);
                    if (receivable && !receivable.has(codec.toUpperCase())) {
                        option.text += " (this browser can't receive it)";
                        option.disabled = true;
                    }
                    else if (!libraries.some(l => l.codecs.includes(codec) && !l.unavailable)) {
                        option.text += " (no encoder available)";
                        option.disabled = true;
                    }
                    codecSelect.add(option);
                }

                selectFirstEnabled(codecSelect);
                fillLibraries();
                setButtonStates(true, false);
            }
            catch (err) {
                document.getElementById("error").textContent = `Could not read the server's libraries: ${err}`;
            }
        }

        // Fills the encoder list with the libraries that encode the chosen codec.
        function fillLibraries() {
            librarySelect.length = 0;
            for (const library of libraries.filter(l => l.codecs.includes(codecSelect.value))) {
                const option = new Option(library.unavailable ? `${library.name} (not available)` : library.name, library.name);
                option.disabled = !!library.unavailable;
                librarySelect.add(option);
            }
            selectFirstEnabled(librarySelect);
            showLibraryInfo();
        }

        // Says what the chosen library is, and why any other one for this codec can't be used.
        function showLibraryInfo() {
            const forCodec = libraries.filter(l => l.codecs.includes(codecSelect.value));
            const chosen = forCodec.find(l => l.name === librarySelect.value);
            const notes = forCodec.filter(l => l.unavailable).map(l => `${l.name}: ${l.unavailable}`);
            document.getElementById("libraryInfo").textContent = [chosen?.description, ...notes].filter(Boolean).join(" ");
        }

        // Shows what the browser is decoding.
        async function showStats() {
            if (!pc) {
                return;
            }

            const stats = await pc.getStats();
            let text = "";
            stats.forEach(report => {
                if (report.type === "inbound-rtp" && report.kind === "video") {
                    const codec = stats.get(report.codecId)?.mimeType ?? "";
                    const size = report.frameWidth ? `${report.frameWidth}x${report.frameHeight}` : "";
                    text = `${codec} ${size} ${Math.round(report.framesPerSecond ?? 0)} fps, ${report.framesDecoded ?? 0} frames decoded`;
                }
            });
            document.getElementById("stats").textContent = text;
        }

        function start() {
            setButtonStates(false, false);
            document.getElementById("error").textContent = "";
            document.getElementById("stats").textContent = "";

            pc = new RTCPeerConnection({ iceServers: [{ urls: STUN_URL }] });

            pc.ontrack = evt => {
                console.log(`Adding ${evt.track.kind} track to the video control.`);
                document.querySelector("#videoCtl").srcObject = evt.streams[0];
            };

            pc.onicecandidate = evt => evt.candidate && ws.send(JSON.stringify(evt.candidate));

            pc.onconnectionstatechange = () => {
                console.log(`Peer connection state changed to ${pc?.connectionState}.`);
                if (pc?.connectionState === "failed") {
                    closePeer();
                }
            };

            // The server reads the codec and library from the query string.
            const url = new URL(document.querySelector("#websockurl").value);
            url.searchParams.set("codec", codecSelect.value);
            url.searchParams.set("library", librarySelect.value);

            let opened = false;
            ws = new WebSocket(url, []);

            ws.onopen = () => {
                opened = true;
                setButtonStates(false, true);
            };

            // The server sends the offer and its ICE candidates; the page answers.
            ws.onmessage = async evt => {
                const obj = JSON.parse(evt.data);
                if (obj?.candidate) {
                    await pc.addIceCandidate(obj);
                }
                else if (obj?.sdp) {
                    await pc.setRemoteDescription(new RTCSessionDescription(obj));
                    await pc.setLocalDescription(await pc.createAnswer());
                    ws.send(JSON.stringify(pc.localDescription));
                }
            };

            // The server closes the web socket once the peer connection is up, which leaves the
            // media flowing. A close before it opened means it refused the connection.
            ws.onclose = evt => {
                console.log(`Web socket closed, code ${evt.code}.`);
                if (!opened) {
                    document.getElementById("error").textContent = "The server refused the connection; its log says why.";
                    closePeer();
                }
            };

            statsTimer = setInterval(showStats, 1000);
        }

        function closePeer() {
            clearInterval(statsTimer);
            pc?.close();
            ws?.close();
            pc = ws = undefined;
            setButtonStates(true, false);
        }

        document.querySelector("#websockurl").value = getWebSocketUrl();
        loadLibraries();
    </script>
</body>
</html>
